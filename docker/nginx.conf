server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos con hash en el nombre (main-XXXX.js, styles-XXXX.css): caché de un año
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API: /api/… se reenvía al core por la red privada, sin el prefijo /api.
    # La dirección va en una variable para que nginx la resuelva en cada
    # petición con el DNS del contenedor: la IP privada cambia en cada despliegue.
    # Se quita Origin porque para el core ya no es una llamada de navegador (CORS).
    location ^~ /api/ {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
        set $api ${API_PRIVATE_URL};
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Origin "";
    }

    # SPA: cualquier ruta desconocida la resuelve el router de Angular
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
