<div class="auth">
  <p class="mark">
    <img src="favicon-64.png" width="32" height="32" alt="" />
    Crockgold
  </p>

  <!-- El escenario: el duende bajo el foco, al final del arcoíris -->
  <aside class="stage" aria-hidden="true">
    <div class="stage__figure">
      <i class="spark" style="--x: 3%; --y: 34%; --s: 1.125rem; --d: 0s"></i>
      <i class="spark" style="--x: 80%; --y: 8%; --s: 0.75rem; --d: 1.2s"></i>
      <i class="spark" style="--x: 93%; --y: 62%; --s: 0.875rem; --d: 2.3s; --c: #fff"></i>
      <i class="spark" style="--x: -6%; --y: 70%; --s: 0.75rem; --d: 0.6s; --c: #fff"></i>
      <i class="spark" style="--x: 18%; --y: 6%; --s: 1rem; --d: 2.9s"></i>
      <i class="spark" style="--x: 55%; --y: -4%; --s: 0.625rem; --d: 1.8s; --c: #fff"></i>
      <i class="spark" style="--x: 101%; --y: 30%; --s: 1.125rem; --d: 0.3s"></i>
      <i class="spark" style="--x: 70%; --y: 96%; --s: 0.75rem; --d: 3.1s"></i>
      <i class="spark" style="--x: 30%; --y: 101%; --s: 0.625rem; --d: 1.5s; --c: #fff"></i>
      <i class="spark" style="--x: -3%; --y: 12%; --s: 0.625rem; --d: 2.1s"></i>
      <img
        src="leprechaun-640.webp"
        srcset="leprechaun-400.webp 400w, leprechaun-640.webp 640w, leprechaun-960.webp 960w"
        sizes="(max-width: 56rem) 14rem, min(39vw, 60vh)"
        width="640"
        height="638"
        alt=""
        decoding="async"
      />
    </div>
  </aside>

  <main class="panel">
    <!-- La hoja: el mismo papel del informe que lee el duende -->
    <div class="sheet">
      <nav class="tabs" aria-label="Acceso">
        <a routerLink="/login" routerLinkActive="is-active" ariaCurrentWhenActive="page">Entrar</a>
        <a routerLink="/register" routerLinkActive="is-active" ariaCurrentWhenActive="page">
          Crear cuenta
        </a>
      </nav>

      <router-outlet />
    </div>
  </main>
</div>
