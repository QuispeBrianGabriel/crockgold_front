<div class="auth">
  <aside class="brand">
    <p class="brand__mark">Crockgold<span>.</span></p>

    <!-- Arcos concéntricos que nacen en la esquina: el arcoíris del crock of gold -->
    <svg class="brand__arcs" viewBox="0 0 400 400" aria-hidden="true">
      <g fill="none" stroke-width="1">
        <circle cx="400" cy="400" r="90" />
        <circle cx="400" cy="400" r="140" />
        <circle cx="400" cy="400" r="190" />
        <circle class="is-lit" cx="400" cy="400" r="240" />
        <circle cx="400" cy="400" r="290" />
        <circle cx="400" cy="400" r="340" />
        <circle cx="400" cy="400" r="390" />
      </g>
    </svg>

    <!-- El duende y su olla: lo que espera al final del arco -->
    <img
      class="brand__art"
      src="leprechaun-640.webp"
      srcset="leprechaun-400.webp 400w, leprechaun-640.webp 640w, leprechaun-960.webp 960w"
      sizes="min(40vw, 68vh)"
      width="640"
      height="638"
      alt=""
      loading="lazy"
      decoding="async"
    />
  </aside>

  <main class="panel">
    <div class="panel__inner">
      <nav class="tabs" aria-label="Acceso">
        <a routerLink="/login" routerLinkActive="is-active" ariaCurrentWhenActive="page">
          <span>01</span> Entrar
        </a>
        <a routerLink="/register" routerLinkActive="is-active" ariaCurrentWhenActive="page">
          <span>02</span> Crear cuenta
        </a>
      </nav>

      <router-outlet />
    </div>
  </main>
</div>
